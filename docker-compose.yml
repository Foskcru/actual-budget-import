services:
  sumeria-import:
    # Image construite automatiquement par GitHub Actions (remplace VOTRE-USER-GITHUB).
    image: ghcr.io/foskcru/actual-budget-import:latest
    # --- Alternative : construire en local au lieu de tirer l'image ---
    # build: .
    container_name: sumeria-import
    restart: unless-stopped
    ports:
      - "8092:3000"          # http://IP-DU-NAS:8092  (ou derriere ton NPM)
    environment:
      # --- Securite (recommande) ---
      APP_SECRET: "UNE_LONGUE_PHRASE_ALEATOIRE"   # chiffre les mots de passe stockes (M3). A garder secret, hors du volume /data.
      COOKIE_SECURE: "true"                        # cookie Secure : mettre true si acces en HTTPS (via NPM)
      # --- Alertes ntfy quand un compte se bloque (8 echecs) : optionnel ---
      # NTFY_URL: "https://ntfy.mon-nas/actual-alertes"   # URL complete du topic ntfy
      # NTFY_TOKEN: "tk_xxx"                               # jeton si le topic est protege (sinon laisser vide)
      # --- Config Actual : OPTIONNELLE (pre-remplit le 1er admin ; ensuite tout se fait dans l'UI) ---
      # ACTUAL_SERVER_URL: "https://ADRESSE-DE-TON-ACTUAL"
      # ACTUAL_PASSWORD:   "MOT_DE_PASSE_DU_SERVEUR_ACTUAL"
      # ACTUAL_SYNC_ID:    "ea76be7f-...."
      # ACTUAL_BUDGET_NAME: "Budget EC"
      # ACTUAL_E2E_PASSWORD: "mot_de_passe_de_chiffrement"
      # --- Optionnel : correspondances de noms de comptes ---
      # ACTUAL_ALIASES: '{"Anniversaire":"SUM Anniversaires"}'
    volumes:
      - ./data:/data        # cache local du budget (persistant)

# Astuce reseau : pour parler a Actual EN INTERNE (sans passer par internet),
# mets ce conteneur sur le meme reseau Docker qu'Actual et utilise
# ACTUAL_SERVER_URL: "http://<nom-service-actual>:5006".
